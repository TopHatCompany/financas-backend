[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.9.0"
bigdecimal = { version = "0.4.6", features = ["serde"] }
chrono = { version = "0.4.24", features = ["serde"] }
derive_more = { version = "1.0.0", features = ["full"] }
diesel = { version = "2.0.4", features = ["extras", "postgres"] }
env_logger = "0.11.5"
log = "0.4.17"
serde = { version = "1.0.160", features = ["derive"] }
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.26.4"
uuid = { version = "1.3.2", features = ["std", "v7", "serde"] }
itertools = "0.13.0"
actix-cors = "0.7.0"
dotenv = "0.15.0"
actix-web-httpauth = "0.8.2"
jsonwebtoken = "9.3.0"
envy = "0.4.2"
awc = { version = "3.5.1", features = ["rustls-0_23"] }
rustls = "0.23.19"
webpki-roots = "0.26.7"
diesel_migrations = "2.2.0"
